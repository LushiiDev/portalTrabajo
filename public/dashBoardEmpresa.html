<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChambaHub - Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <!-- Sidebar -->
      <div
        class="bg-white border-end vh-100 p-3 d-flex flex-column"
        style="width: 200px; position: fixed"
      >
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <div
            class="rounded-2 d-flex align-items-center justify-content-center p-2"
          >
            <a href="./index.html"><img
              src="../img/LogoEmpresa.png"
              alt="Bootstrap"
              width="150px"
              height="50px"
            /></a>
          </div>
        </div>
        <ul class="nav flex-column gap-1">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link active rounded-2 bg-primary bg-opacity-10 text-primary fw-medium small"
            >
              <i class="bi bi-grid-1x2 me-2"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a
              href="publicarOferta.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-plus-circle me-2"></i>Publicar Oferta
            </a>
          </li>
          <li class="nav-item">
            <a
              href="vacante.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-briefcase me-2"></i>Mis Vacantes
            </a>
          </li>
          <li class="nav-item">
            <a
              href="perfilEmpresa.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-building me-2"></i>Perfil Empresa
            </a>
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="flex-grow-1 p-4" style="margin-left: 200px">
        <h5 class="fw-bold mb-1">Dashboard</h5>
        <p id="dashboardWelcome" class="text-muted small mb-4">Bienvenido al panel de empleador</p>

        <!-- Stat Cards -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card border rounded-3 shadow-none">
              <div
                class="card-body d-flex justify-content-between align-items-center"
              >
                <div>
                  <p class="text-muted small mb-1">Total Vacantes</p>
                  <h3 id="totalJobsCard" class="fw-bold mb-0">0</h3>
                </div>
                <div
                  class="bg-primary bg-opacity-10 rounded-2 d-flex align-items-center justify-content-center p-2"
                >
                  <i class="bi bi-briefcase-fill text-primary fs-4"></i>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border rounded-3 shadow-none">
              <div
                class="card-body d-flex justify-content-between align-items-center"
              >
                <div>
                  <p class="text-muted small mb-1">Total Postulantes</p>
                  <h3 id="totalApplicantsCard" class="fw-bold mb-0">0</h3>
                </div>
                <div
                  class="bg-success bg-opacity-10 rounded-2 d-flex align-items-center justify-content-center p-2"
                >
                  <i class="bi bi-people-fill text-success fs-4"></i>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border rounded-3 shadow-none">
              <div
                class="card-body d-flex justify-content-between align-items-center"
              >
                <div>
                  <p class="text-muted small mb-1">Vacantes Activas</p>
                  <h3 id="activeJobsCard" class="fw-bold mb-0">0</h3>
                </div>
                <div
                  class="bg-warning bg-opacity-10 rounded-2 d-flex align-items-center justify-content-center p-2"
                >
                  <i class="bi bi-grid-fill text-warning fs-4"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Posts Table -->
        <div class="card border rounded-3 shadow-none">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold mb-0">Publicaciones recientes</h6>
              <button id="newOfferBtn" class="btn btn-primary btn-sm">Nueva oferta</button>
            </div>
            <table class="table table-borderless align-middle">
              <thead class="border-bottom">
                <tr class="text-muted text-uppercase small">
                  <th class="fw-semibold">Título</th>
                  <th class="fw-semibold">Estado</th>
                  <th class="fw-semibold">Postulantes</th>
                  <th class="fw-semibold">Acciones</th>
                </tr>
              </thead>
              <tbody id="recentJobsTableBody">
                <tr>
                  <td colspan="4" class="text-center text-muted py-3">Cargando vacantes...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/compania.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/dashboardEmpresa.js"></script>
  </body>
</html>
