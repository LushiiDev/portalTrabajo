<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChambaHub - Publicar Oferta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="d-flex">
      <!-- Sidebar -->
      <div
        class="bg-white border-end vh-100 p-3 d-flex flex-column"
        style="width: 200px; position: fixed"
      >
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <div
            class="rounded-2 d-flex align-items-center justify-content-center p-2"
          >
            <a href="./index.html"><img
              src="../img/LogoEmpresa.png"
              alt="Bootstrap"
              width="150px"
              height="50px"
            /></a>
          </div>
        </div>
        <ul class="nav flex-column gap-1">
          <li class="nav-item">
            <a
              href="dashBoardEmpresa.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-grid-1x2 me-2"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link active rounded-2 bg-primary bg-opacity-10 text-primary fw-medium small"
            >
              <i class="bi bi-plus-circle me-2"></i>Publicar Oferta
            </a>
          </li>
          <li class="nav-item">
            <a
              href="vacante.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-briefcase me-2"></i>Mis Vacantes
            </a>
          </li>
          <li class="nav-item">
            <a
              href="perfilEmpresa.html"
              class="nav-link text-secondary rounded-2 small"
            >
              <i class="bi bi-building me-2"></i>Perfil Empresa
            </a>
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="flex-grow-1 p-4" style="margin-left: 200px">
        <!-- Back link -->
        <a
          href="#"
          class="text-primary text-decoration-none small d-flex align-items-center gap-1 mb-3"
        >
          <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>

        <h4 class="fw-bold mb-1">Publicar Nueva Oferta</h4>
        <p class="text-muted small mb-4">
          Completa la información de la vacante
        </p>

        <!-- Form Card -->
        <div class="card border rounded-3 shadow-none">
          <div class="card-body p-4">
            <form id="publishJobForm" novalidate>
            <!-- Título del puesto -->
            <div class="mb-3">
              <label class="form-label small fw-medium"
                >Título del puesto <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="jobTitle"
                name="title"
                class="form-control form-control-sm bg-light border"
                placeholder="ej. Frontend Developer"
                required
              />
            </div>

            <!-- Descripción del puesto -->
            <div class="mb-1">
              <label class="form-label small fw-medium"
                >Descripción del puesto
                <span class="text-danger">*</span></label
              >
              <textarea
                id="jobDescription"
                name="description"
                class="form-control bg-light border"
                rows="5"
                placeholder="Describe las responsabilidades, requisitos y beneficios del puesto..."
                minlength="100"
                required
              ></textarea>
            </div>
            <p class="text-muted mb-3" style="font-size: 11px">
              Mínimo 100 caracteres
            </p>

            <!-- Ubicación y Tipo de contrato -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-medium"
                  >Ubicación <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="jobLocation"
                  name="location"
                  class="form-control form-control-sm bg-light border"
                  placeholder="Ciudad, País"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-medium"
                  >Tipo de contrato <span class="text-danger">*</span></label
                >
                <select
                  id="jobContractType"
                  name="contractType"
                  class="form-select form-select-sm bg-light border"
                  required
                >
                  <option value="" disabled selected>Selecciona</option>
                  <option value="Tiempo completo">Tiempo completo</option>
                  <option value="Medio tiempo">Medio tiempo</option>
                  <option value="Freelance">Freelance</option>
                  <option value="Prácticas">Prácticas</option>
                </select>
              </div>
            </div>

            <!-- Rango salarial y Nivel de experiencia -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-medium"
                  >Rango salarial (USD)
                  <span class="text-danger">*</span></label
                >
                <div class="d-flex gap-2">
                  <input
                    type="number"
                    id="jobSalaryMin"
                    name="salaryMin"
                    class="form-control form-control-sm bg-light border"
                    placeholder="Mínimo"
                    min="0"
                    required
                  />
                  <input
                    type="number"
                    id="jobSalaryMax"
                    name="salaryMax"
                    class="form-control form-control-sm bg-light border"
                    placeholder="Máximo"
                    min="0"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-medium"
                  >Nivel de experiencia
                  <span class="text-danger">*</span></label
                >
                <select
                  id="jobExperienceLevel"
                  name="experienceLevel"
                  class="form-select form-select-sm bg-light border"
                  required
                >
                  <option value="" disabled selected>Selecciona</option>
                  <option value="Junior (0-2 años)">Junior (0-2 años)</option>
                  <option value="Semi-Senior (2-4 años)">Semi-Senior (2-4 años)</option>
                  <option value="Senior (4+ años)">Senior (4+ años)</option>
                </select>
              </div>
            </div>

            <!-- Modalidad de trabajo -->
            <div class="mb-4">
              <label class="form-label small fw-medium"
                >Modalidad de trabajo <span class="text-danger">*</span></label
              >
              <div class="d-flex gap-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="workMode"
                    value="Presencial"
                    id="fulltime"
                    checked
                  />
                  <label class="form-check-label small" for="fulltime"
                    >Presencial</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="workMode"
                    value="Hibrido"
                    id="parttime"
                  />
                  <label class="form-check-label small" for="parttime"
                    >Hibrido</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="workMode"
                    value="Remoto"
                    id="remote"
                  />
                  <label class="form-check-label small" for="remote"
                    >Remoto</label
                  >
                </div>
              </div>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm px-4">
                Publicar oferta
              </button>
              <button type="button" id="cancelPublishBtn" class="btn btn-outline-secondary btn-sm px-3">
                Cancelar
              </button>
            </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/compania.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/publicarOferta.js"></script>
  </body>
</html>
