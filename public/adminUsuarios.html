<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin - Gestión de Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container-fluid px-0">
      <div class="row g-0 min-vh-100">
        <aside class="col-12 col-lg-3 col-xl-2 bg-white border-end p-3 p-md-4">
          <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-shield-check fs-4 text-warning"></i>
            <div class="h4 mb-0 fw-bold text-warning-emphasis">Panel Admin</div>
          </div>

          <nav class="admin-nav nav nav-pills flex-column gap-2">
            <a class="nav-link d-flex align-items-center gap-2" href="./adminUsuarios.html">
              <i class="bi bi-people"></i> Gestión de Usuarios
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="./adminOfertas.html">
              <i class="bi bi-briefcase"></i> Gestión de Ofertas
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="./adminForos.html">
              <i class="bi bi-exclamation-triangle"></i> Moderación de Foros
            </a>
          </nav>
        </aside>

        <main class="col-12 col-lg-9 col-xl-10 p-3 p-md-4 p-xl-5">
          <div id="adminBanner" class="alert alert-warning mb-3 d-none"></div>

          <div class="d-flex align-items-end justify-content-between flex-wrap gap-3 mb-3">
            <div>
              <h1 class="display-6 fw-bold mb-1">Gestión de Usuarios</h1>
              <div class="text-secondary">Administra los usuarios de la plataforma</div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-xl-6">
              <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  id="searchInput"
                  type="text"
                  class="form-control"
                  placeholder="Buscar por nombre o rol..."
                />
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <select id="roleFilter" class="form-select">
                <option value="">Todos los roles</option>
                <option value="candidato">Candidato</option>
                <option value="empleador">Empleador</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <select id="statusFilter" class="form-select">
                <option value="">Todos los estados</option>
                <option value="activo">Activo</option>
                <option value="suspendido">Suspendido</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card h-100 shadow-sm border-start border-4 border-primary-subtle">
                <div class="card-body">
                  <div class="text-secondary small text-uppercase">Total Usuarios</div>
                  <div id="statTotal" class="display-6 fw-bold mb-0">-</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card h-100 shadow-sm border-start border-4 border-success-subtle">
                <div class="card-body">
                  <div class="text-secondary small text-uppercase">Activos</div>
                  <div id="statActive" class="display-6 fw-bold mb-0">-</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card h-100 shadow-sm border-start border-4 border-warning-subtle">
                <div class="card-body">
                  <div class="text-secondary small text-uppercase">Suspendidos</div>
                  <div id="statSuspended" class="display-6 fw-bold mb-0">-</div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="card h-100 shadow-sm border-start border-4 border-info-subtle">
                <div class="card-body">
                  <div class="text-secondary small text-uppercase">Nuevos (30d)</div>
                  <div id="statNew30" class="display-6 fw-bold mb-0">-</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body p-3">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Nombre</th>
                      <th>Email</th>
                      <th>Rol</th>
                      <th>Estado</th>
                      <th>Registro</th>
                      <th>Último acceso</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="usersTbody">
                    <tr>
                      <td colspan="7" class="text-muted">Cargando...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- JSON Modal -->
    <div class="modal fade" id="jsonModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="border-radius: 18px">
          <div class="modal-header">
            <h5 class="modal-title" id="jsonModalTitle">Detalle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <pre
              id="jsonModalPre"
              class="mb-0 p-3"
              style="background: #0b1220; color: #e5e7eb; border-radius: 14px"
            ></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="adminToast" class="toast align-items-center text-bg-info border-0" role="alert">
        <div class="d-flex">
          <div id="adminToastBody" class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/adminUsuarios.js"></script>
  </body>
</html>
