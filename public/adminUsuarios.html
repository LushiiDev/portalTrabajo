<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin - Gestión de Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="./css/admin.css" rel="stylesheet" />
  </head>
  <body class="admin">
    <div class="d-flex admin-shell">
      <aside class="admin-sidebar p-3">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <i class="bi bi-shield-check" style="font-size: 20px; color: #d35400"></i>
          <div class="admin-brand" style="font-size: 22px">Panel Admin</div>
        </div>

        <nav class="admin-nav d-flex flex-column gap-2">
          <a class="text-decoration-none d-flex align-items-center gap-2" href="./adminUsuarios.html">
            <i class="bi bi-people"></i> Gestión de Usuarios
          </a>
          <a class="text-decoration-none d-flex align-items-center gap-2" href="./adminOfertas.html">
            <i class="bi bi-briefcase"></i> Gestión de Ofertas
          </a>
          <a class="text-decoration-none d-flex align-items-center gap-2" href="./adminForos.html">
            <i class="bi bi-exclamation-triangle"></i> Moderación de Foros
          </a>
        </nav>
      </aside>

      <main class="admin-main flex-grow-1">
        <div id="adminBanner" class="admin-banner mb-3 d-none"></div>

        <div class="d-flex align-items-end justify-content-between flex-wrap gap-3 mb-3">
          <div>
            <h1 class="fw-black mb-1" style="font-weight: 900">Gestión de Usuarios</h1>
            <div class="admin-subtitle">Administra los usuarios de la plataforma</div>
          </div>
        </div>

        <div class="admin-toolbar d-grid gap-3 mb-3" style="grid-template-columns: 1fr 260px 260px">
          <div class="input-group">
            <span class="input-group-text bg-white border-0" style="border-radius: 14px 0 0 14px">
              <i class="bi bi-search"></i>
            </span>
            <input
              id="searchInput"
              type="text"
              class="form-control border-0"
              style="border-radius: 0 14px 14px 0"
              placeholder="Buscar por nombre o rol..."
            />
          </div>
          <select id="roleFilter" class="form-select">
            <option value="">Todos los roles</option>
            <option value="candidato">Candidato</option>
            <option value="empleador">Empleador</option>
            <option value="admin">Admin</option>
          </select>
          <select id="statusFilter" class="form-select">
            <option value="">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="suspendido">Suspendido</option>
          </select>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-3">
            <div class="stat-card">
              <div class="stat-title">Total Usuarios</div>
              <div id="statTotal" class="stat-value">-</div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="stat-card green">
              <div class="stat-title">Activos</div>
              <div id="statActive" class="stat-value">-</div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="stat-card yellow">
              <div class="stat-title">Suspendidos</div>
              <div id="statSuspended" class="stat-value">-</div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="stat-card cyan">
              <div class="stat-title">Nuevos (30d)</div>
              <div id="statNew30" class="stat-value">-</div>
            </div>
          </div>
        </div>

        <div class="admin-card p-3">
          <div class="table-responsive">
            <table class="table align-middle admin-table mb-0">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Registro</th>
                  <th>Último acceso</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="usersTbody">
                <tr>
                  <td colspan="7" class="text-muted">Cargando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- JSON Modal -->
    <div class="modal fade" id="jsonModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="border-radius: 18px">
          <div class="modal-header">
            <h5 class="modal-title" id="jsonModalTitle">Detalle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <pre
              id="jsonModalPre"
              class="mb-0 p-3"
              style="background: #0b1220; color: #e5e7eb; border-radius: 14px"
            ></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="adminToast" class="toast align-items-center text-bg-info border-0" role="alert">
        <div class="d-flex">
          <div id="adminToastBody" class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/adminUsuarios.js"></script>
  </body>
</html>
